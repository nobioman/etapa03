
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#EC0075">
  <title>Atendimento Interativo — Central de Atendimento</title>

  <style>
    :root {
      --pink: #EC0075;
      --pink-dark: #c90063;
      --pink-soft: #fff0f7;
      --ink: #252631;
      --muted: #687080;
      --bubble: #f4f5fa;
      --line: #e6e7ed;
      --white: #fff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #f7f7fa;
      color: var(--ink);
      font-family: Inter, system-ui, -apple-system, sans-serif;
      line-height: 1.5;
    }

    button, input { font: inherit; }

    .app {
      width: min(100%, 560px);
      min-height: 100vh;
      margin: auto;
      display: flex;
      flex-direction: column;
      background: var(--white);
      box-shadow: 0 0 32px #1e14200f;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 5;
      padding: 15px 18px 12px;
      background: #fffffff5;
      border-bottom: 3px solid var(--pink);
      backdrop-filter: blur(10px);
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand-logo {
      display: block;
      width: 150px;
      height: 45px;
      object-fit: contain;
      object-position: left center;
    }

    .demo-pill {
      color: var(--pink-dark);
      background: var(--pink-soft);
      border: 1px solid #ffd0e5;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: .68rem;
      font-weight: 800;
      white-space: nowrap;
    }

    .breadcrumb {
      margin-top: 10px;
      color: var(--muted);
      font-size: .78rem;
    }

    .notice {
      margin: 14px 14px 0;
      padding: 10px 12px;
      border: 1px solid #ffd0e5;
      background: var(--pink-soft);
      border-radius: 12px;
      color: #7d1748;
      font-size: .78rem;
    }

    main {
      flex: 1;
      padding: 16px 14px 22px;
    }

    #chat {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      max-width: 90%;
      padding: 12px 14px;
      border-radius: 18px;
      font-size: .96rem;
      overflow-wrap: anywhere;
      animation: appear .22s ease-out both;
    }


/* Linha que agrupa a mini foto e a mensagem */
.bot-message-row {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  max-width: 100%;
}

/* Mini logo de perfil do bot */
.bot-avatar {
  width: 32px;
  height: 32px;
  min-width: 32px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid #EC0075;
  background: #fff;
  flex-shrink: 0;
}

/* A mensagem ocupa o espaço restante */
.bot-message-row .message.bot {
  max-width: calc(100% - 40px);
}

    .message.bot {
      align-self: flex-start;
      background: var(--bubble);
      border-top-left-radius: 6px;
    }

    .message.user {
      align-self: flex-end;
      color: white;
      background: var(--pink);
      border-bottom-right-radius: 6px;
    }

    .message small {
      display: block;
      opacity: .72;
      margin-top: 5px;
      font-size: .72rem;
    }

    .typing {
      display: flex;
      align-items: center;
      gap: 5px;
      min-width: 65px;
      color: var(--muted);
      font-size: .75rem;
    }

    .typing span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #9a9eaa;
      animation: bounce .9s infinite ease-in-out;
    }

    .typing span:nth-child(2) { animation-delay: .12s; }
    .typing span:nth-child(3) { animation-delay: .24s; }

    .info-card {
      width: 100%;
      margin-top: 9px;
      padding: 12px;
      background: white;
      border: 1px solid var(--line);
      border-radius: 12px;
    }

    .card-title {
      font-weight: 800;
      color: var(--pink-dark);
      margin-bottom: 6px;
    }

    .demo-placeholder {
      min-height: 135px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 16px;
      text-align: center;
      color: var(--muted);
      background: #fafafa;
      border: 1px dashed #d9a1bd;
      border-radius: 12px;
      font-size: .85rem;
    }

    .demo-placeholder strong {
      color: var(--pink-dark);
    }

    .choices {
      display: flex;
      flex-direction: column;
      gap: 9px;
      margin: 12px 0 8px;
      animation: appear .22s ease-out both;
    }

    .choices-label {
      color: var(--muted);
      font-size: .78rem;
      padding: 0 3px;
    }

    .choice {
      width: 100%;
      text-align: left;
      padding: 12px 14px;
      border: 1px solid #f1b5d2;
      border-radius: 14px;
      background: white;
      color: var(--ink);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      transition: transform .15s, background .15s, border-color .15s;
    }

    .choice::after {
      content: "›";
      color: var(--pink);
      font-size: 1.35rem;
      line-height: 1;
    }

    .choice:hover {
      border-color: var(--pink);
      background: var(--pink-soft);
    }

    .choice:active { transform: scale(.99); }

    .field-label {
      display: block;
      margin: 6px 0;
      font-size: .83rem;
      font-weight: 700;
    }

    .demo-input {
      width: 100%;
      padding: 12px;
      border: 1px solid #e2b3ca;
      border-radius: 12px;
      outline: none;
      background: white;
      color: var(--ink);
    }

    .demo-input:focus {
      border-color: var(--pink);
      box-shadow: 0 0 0 3px #ec00751a;
    }

    .submit-button {
      width: 100%;
      margin-top: 9px;
      padding: 12px;
      border: 0;
      border-radius: 12px;
      background: var(--pink);
      color: white;
      font-weight: 750;
      cursor: pointer;
    }

    .submit-button:hover { background: var(--pink-dark); }

    .footer {
      padding: 13px 16px 17px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      text-align: center;
      font-size: .74rem;
      background: white;
    }

    .restart {
      margin-top: 8px;
      border: 0;
      background: transparent;
      color: var(--pink-dark);
      font-weight: 750;
      cursor: pointer;
      padding: 5px 8px;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid #f7a5cd;
      outline-offset: 2px;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-5px); }
    }

    @media (min-width: 600px) {
      body { padding: 22px 0; }

      .app {
        min-height: calc(100vh - 44px);
        border: 1px solid var(--line);
        border-radius: 20px;
        overflow: hidden;
      }

      header { position: relative; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

let stepToken = 0;
let activeTimers = [];

// Guarda a chave digitada durante a sessão atual.
let chavePixCadastrada = "";

function clearTimers() {
  activeTimers.forEach(timer => clearTimeout(timer));
  activeTimers = [];
}

function schedule(callback, delay, token) {
  const timer = setTimeout(() => {
    if (token === stepToken) callback();
  }, delay);

  activeTimers.push(timer);
}

function scrollToLatest() {
  requestAnimationFrame(() => {
    chat.scrollTop = chat.scrollHeight;
  });
}

function addMessage(text, who = "bot") {
  const message = document.createElement("div");
  message.className = `message ${who}`;
  if (typeof text === "object" && text !== null) {
  const conteudo = text.text ?? "";
  const destaque = text.highlight;

  if (destaque && conteudo.includes(destaque)) {
    const partes = conteudo.split(destaque);

    message.appendChild(
      document.createTextNode(partes[0])
    );

    const span = document.createElement("span");
    span.textContent = destaque;
    span.style.color = text.color || "#2E9439";

    message.appendChild(span);

    message.appendChild(
      document.createTextNode(partes.slice(1).join(destaque))
    );
  } else {
    message.textContent = conteudo;
  }
} else {
  message.textContent = text ?? "";
}
  chat.appendChild(message);
  scrollToLatest();
  return message;
}

function showTyping() {
  const message = document.createElement("div");
  message.className = "message bot";

  const typing = document.createElement("div");
  typing.className = "typing";
  typing.setAttribute("aria-label", "");

  for (let i = 0; i < 3; i++) {
    const dot = document.createElement("span");
    dot.setAttribute("aria-hidden", "true");
    typing.appendChild(dot);
  }

  const caption = document.createElement("span");
  caption.textContent = "";
  caption.style.marginLeft = "5px";

  typing.appendChild(caption);
  message.appendChild(typing);
  chat.appendChild(message);
  scrollToLatest();

  return message;
}

function addCard(card) {
  const message = document.createElement("div");
  message.className = "message bot";

  const wrapper = document.createElement("div");
  wrapper.className = "info-card";

  const title = document.createElement("div");
  title.className = "card-title";
  title.textContent = card.title;
  wrapper.appendChild(title);

  const list = document.createElement("ul");
  list.style.paddingLeft = "19px";
  list.style.margin = "7px 0 0";

  card.lines.forEach(line => {
    const item = document.createElement("li");
    item.style.marginTop = "6px";

    if (typeof line === "object" && line !== null) {
      item.textContent = line.text ?? "";
      if (line.color) {
        item.style.color = line.color;
      }
    } else {
      const texto =
        typeof line === "function" ? line() : line;

      if (texto === "Status: APROVADO") {
        item.append("Status: ");

        const aprovado = document.createElement("span");
        aprovado.textContent = "APROVADO";
        aprovado.style.color = "#2E9439";
        aprovado.style.fontWeight = "bold";
        item.appendChild(aprovado);
      } else {
        item.textContent = texto ?? "";
      }
    }

    list.appendChild(item);
  });

  wrapper.appendChild(list);
  message.appendChild(wrapper);
  chat.appendChild(message);
  scrollToLatest();
}



function addImagePlaceholder(src, alt = "Imagem ilustrativa") {
  const message = document.createElement("div");
  message.className = "message bot";

  const wrapper = document.createElement("div");
  wrapper.className = "info-card";

  const image = document.createElement("img");
  image.alt = alt;
  image.loading = "eager";
  image.decoding = "async";
  image.style.display = "block";
  image.style.width = "100%";
  image.style.maxWidth = "100%";
  image.style.height = "auto";
  image.style.objectFit = "contain";
  image.style.borderRadius = "12px";

  const error = document.createElement("p");
  error.textContent =
    "Imagem indisponível. Confira o nome, o caminho e se o arquivo foi publicado.";
  error.style.color = "var(--pink-dark)";
  error.style.fontSize = ".85rem";
  error.style.margin = "8px 0 0";
  error.hidden = true;

  image.addEventListener("error", () => {
    image.hidden = true;
    error.hidden = false;
  });

  image.addEventListener("load", () => {
    image.hidden = false;
    error.hidden = true;
  });

  wrapper.append(image, error);
  message.appendChild(wrapper);
  chat.appendChild(message);

  // Atribuir depois dos eventos para não perder erros de carregamento.
  image.src = src;

  scrollToLatest();
  return message;
}



function renderChoices(step, token) {
  options.replaceChildren();
  options.hidden = false;

  if (step.choices?.length) {
    const label = document.createElement("div");

    options.appendChild(label);

    step.choices.forEach(choice => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "choice";
      button.textContent = choice.label;

      button.addEventListener("click", () => {
        if (token !== stepToken) return;
        choose(choice);
      });

      options.appendChild(button);

  }

    input.type = "text";
    input.placeholder = step.input.placeholder;
    input.autocomplete = "off";
    input.maxLength = 60;

    const note = document.createElement("small");
    note.textContent = "Use somente um nome fictício. Não informe dados pessoais ou financeiros.";
    note.style.display = "block";
    note.style.marginTop = "7px";
    note.style.color = "var(--muted)";

    const button = document.createElement("button");
    button.type = "submit";
    button.className = "submit-button";
    button.textContent = step.input.button;

    form.append(label, input, note, button);

    form.addEventListener("submit", event => {
      event.preventDefault();
      if (token !== stepToken) return;

      
const value = input.value.trim();

// Guarda a chave digitada para reutilizá-la nos próximos blocos.
chavePixCadastrada = value;

addMessage(
  value
    ? `Chave Pix: ${chavePixCadastrada}`
    : "Continuar sem informar uma chave",
  "user"
);


      // O nome é usado apenas na mensagem desta sessão.
      // Não é armazenado nem enviado a um servidor.
      options.replaceChildren();
      options.hidden = true;

      const currentToken = ++stepToken;
      const typing = showTyping();

      schedule(() => {
        typing.remove();
        renderStep(step.input.next);
      }, 650, currentToken);
    });

    options.appendChild(form);
  }

  scrollToLatest();
}

function renderStep(key) {
  clearTimers();

  const token = ++stepToken;
  const step = flow[key];

  if (!step) return;

  options.replaceChildren();
  options.hidden = true;

  let index = 0;

  function showNextMessage() {
    if (token !== stepToken) return;

    if (index >= step.messages.length) {
      showStepExtras();
      return;
    }

    const typing = showTyping();
    const delay = Math.min(1600, 550 + step.messages[index].length * 9);

    schedule(() => {
      typing.remove();
      const mensagem = step.messages[index];

addMessage(
  typeof mensagem === "function" ? mensagem() : mensagem
);
      index++;
      schedule(showNextMessage, 400, token);
    }, delay, token);
  }

  function showStepExtras() {
    if (token !== stepToken) return;

    if (step.pauseAfter) {
      const typing = showTyping();

      schedule(() => {
        typing.remove();
        renderExtras();
      }, step.pauseAfter, token);
    } else {
      renderExtras();
    }
  }

  
function renderExtras() {
  if (token !== stepToken) return;

  if (step.card) {
    addCard(step.card);
  }

  if (step.imageSrc) {
    addImagePlaceholder(step.imageSrc, step.imageAlt);
  }

  renderChoices(step, token);
}


  showNextMessage();
}

function choose(choice) {
  // Abre o link quando a opção for configurada para redirecionar.
  if (choice.action === "redirect" && choice.url) {
    window.location.href = choice.url;
    return;
  }

  clearTimers();

  addMessage(choice.label, "user");
  options.replaceChildren();
  options.hidden = true;

  const token = ++stepToken;
  const typing = showTyping();

  schedule(() => {
    typing.remove();
    renderStep(choice.next);
  }, 650, token);
}

function start() {
  clearTimers();
  stepToken++;
  chat.replaceChildren();
  options.replaceChildren();
  options.hidden = true;
  renderStep("bloco1");
}

restartButton.addEventListener("click", start);

start();
</script>

<script>
(() => {
  const chat = document.querySelector("#chat");
  if (!chat) {
    console.error('Não encontrei o elemento #chat.');
    return;
  }

  const logoPath = "./images/perfil.png";

  function adicionarLogo() {
    const mensagens = chat.querySelectorAll(".message.bot");

    mensagens.forEach((mensagem) => {
      if (mensagem.dataset.logoVerificada === "sim") return;

      // Ignora mensagens temporárias de digitação
      if (
        mensagem.classList.contains("typing") ||
        mensagem.classList.contains("typing-indicator") ||
        mensagem.querySelector(".typing, .typing-indicator")
      ) return;

      // Ignora mensagens vazias
      if (
        !mensagem.textContent.trim() &&
        !mensagem.querySelector("img, canvas, video")
      ) return;

      mensagem.dataset.logoVerificada = "sim";

      // Evita adicionar a logo mais de uma vez ao mesmo bloco
      if (mensagem.closest(".bot-session-row")) return;

      // Mostra a logo apenas na primeira mensagem do bot
      // que ainda não pertence a uma linha com logo.
      if (chat.querySelector(".bot-session-row")) return;

      const linha = document.createElement("div");
      linha.className = "bot-session-row";

      const logo = document.createElement("img");
      logo.className = "bot-session-avatar";
      logo.src = logoPath;
      logo.alt = "Logo do atendimento";

      logo.onerror = () => {
        console.error("Imagem não encontrada:", logoPath);
      };

      mensagem.parentNode.insertBefore(linha, mensagem);
      linha.appendChild(logo);
      linha.appendChild(mensagem);
    });
  }

  adicionarLogo();

  const observer = new MutationObserver(adicionarLogo);
  observer.observe(chat, {
    childList: true,
    subtree: true
  });
})();
</script>
